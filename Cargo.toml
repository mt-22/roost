[package]
name = "roost"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A TUI-first, Rust-based dotfiles manager with git-sync"
authors = ["Marshall Taylor"]
keywords = ["dotfiles", "dotfile-manager", "tui", "rust", "git", "configuration"]
categories = ["command-line-utilities", "development-tools", "filesystem"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
color-eyre = "0.6"
dialoguer = "0.12"
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
time = "0.3"
ctrlc = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
